name: build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 9G
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af > /dev/null || true
          df -h /

      - name: Restore host tools (pahole, bindgen)
        uses: actions/cache@v4
        with:
          path: ~/host-tools
          key: host-tools-pahole1.30-bindgen0.72.1-noble

      - name: Host packages
        run: |
          # LLVM 22 from apt.llvm.org: the major Android builds android17-6.18 with (its pinned
          # clang-r584948c is 22.0.1, build.config.constants); Ubuntu 24.04 only has up to 19, and
          # googlesource serves the r584948c archive too slowly for every run (a54c64a)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev libdw-dev zlib1g-dev cmake cpio lz4 zstd \
            ccache kmod python3 clang-22 lld-22 llvm-22
          /usr/lib/llvm-22/bin/clang --version | head -1
          # pahole (the kernel's BTF): Ubuntu 24.04's 1.25 stops at 4096 per-CPU variables and writes
          # BTF 6.18's resolve_btfids refuses ("load BTF from vmlinux.unstripped: Invalid argument",
          # run 45375007648); 1.30 from its release tag
          # (pahole and bindgen are kept in ~/host-tools between runs: built once, not every time)
          T=$HOME/host-tools
          if [ ! -x "$T/bin/pahole" ]; then
            git clone -q --depth 1 --branch v1.30 --recurse-submodules --shallow-submodules \
              https://github.com/acmel/dwarves /tmp/dwarves
            cmake -S /tmp/dwarves -B /tmp/dwarves/build -DCMAKE_BUILD_TYPE=Release -D__LIB=lib \
              -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$T" > /dev/null
            make -C /tmp/dwarves/build -j"$(nproc)" > /dev/null
            make -C /tmp/dwarves/build install > /dev/null
          fi
          echo "$T/bin" >> "$GITHUB_PATH"
          export PATH=$T/bin:$PATH
          pahole --version
          # Rust (CONFIG_RUST, as gki_defconfig: Android's ashmem is a Rust driver in 6.18, and the
          # Rust binder module): rustc 1.91.1 as build.config.constants pins (RUSTC_VERSION), with
          # the standard library's source, and bindgen on clang 22's libclang
          rustup toolchain install 1.91.1 --profile minimal --component rust-src --component rustfmt > /dev/null
          rustup default 1.91.1
          # bindgen 0.71+ (6.18's rust/bindgen_parameters uses --with-attribute-custom-enum; Ubuntu's
          # 0.66.1 refused it, run 45406978150)
          [ -x "$T/bin/bindgen" ] || cargo install -q bindgen-cli --version 0.72.1 --locked --root "$T"
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
          rustc --version; bindgen --version

      - name: Sources
        run: bash scripts/fetch.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build GKI kernel
        run: bash scripts/build_gki.sh

      - name: Build SoC modules (sun)
        id: soc
        continue-on-error: true
        run: bash scripts/build_soc.sh

      - name: Build techpack modules (sun)
        id: tp
        continue-on-error: true
        run: bash scripts/build_tp.sh

      - name: Build OnePlus boot modules
        id: oplus
        continue-on-error: true
        run: bash scripts/build_oplus.sh

      - name: Build OnePlus extra modules (touch)
        id: extra
        continue-on-error: true
        run: bash scripts/build_extra.sh

      # (WALT too: scripts/build_walt.sh, run by build_vendor.sh between OnePlus' modules it needs and
      # those that need it)
      - name: Build every other OnePlus driver (from OnePlus' Bazel definitions) and WALT
        id: vendor
        continue-on-error: true
        run: bash scripts/build_vendor.sh

      # msm_drm from the OnePlus 13's own display sources with OnePlus' display extension: it links
      # against OnePlus' modules, so after them; build_tp.sh's OnePlus 15 one stays if it fails
      - name: Display driver (the OnePlus 13's, with OnePlus' extension)
        id: display
        continue-on-error: true
        run: bash scripts/build_display.sh

      - name: Boot image
        id: bootimg
        continue-on-error: true
        run: bash scripts/build_bootimg.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}

      - name: Collect
        if: always()
        run: |
          ccache -s || true
          mkdir -p dist/gki dist/soc dist/logs
          cp out/gki/arch/arm64/boot/Image out/gki/.config out/gki/Module.symvers \
            out/gki/include/config/kernel.release dist/gki/ 2>/dev/null || true
          [ -d out/gki-staging ] && cp -r out/gki-staging dist/gki/ || true
          find src/soc -name '*.ko' -exec cp {} dist/soc/ \; 2>/dev/null || true
          cp src/soc/Module.symvers dist/soc/ 2>/dev/null || true
          mkdir -p dist/tp && cp out/tpmods/*.ko dist/tp/ 2>/dev/null || true
          cp -r out/tp-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/oplus && cp out/oplusmods/*.ko dist/oplus/ 2>/dev/null || true
          cp -r out/oplus-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/extra && cp out/extramods/*.ko dist/extra/ 2>/dev/null || true
          cp -r out/extra-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/vendor && cp out/vendormods/*.ko dist/vendor/ 2>/dev/null || true
          cp -r out/vendor-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/walt && cp out/waltmods/*.ko dist/walt/ 2>/dev/null || true
          cp -r out/walt-log dist/logs/ 2>/dev/null || true
          cp -r out/display-log dist/logs/ 2>/dev/null && rm -f dist/logs/display-log/*.ko || true
          cp out/vendor/modules.json out/vendor/plan.txt dist/logs/ 2>/dev/null || true
          cp -r out/boot/full dist/logs/full-lists 2>/dev/null || true
          cp out/*.log out/*.txt dist/logs/ 2>/dev/null || true
          cp out/soc-kconfig/.config dist/logs/soc.config 2>/dev/null || true
          cp out/boot/*.img dist/ 2>/dev/null || true
          cp out/boot/*.txt out/boot/*.log out/boot/depmod.err dist/logs/ 2>/dev/null || true
          cp -r out/boot/stage/rd/lib/modules dist/layer-modules 2>/dev/null && rm -f dist/layer-modules/*.ko || true
          echo "soc modules: $(ls dist/soc/*.ko 2>/dev/null | wc -l), techpack modules: $(ls dist/tp/*.ko 2>/dev/null | wc -l)"
          du -sh dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op13-618-${{ github.run_number }}
          path: dist/
          retention-days: 14
